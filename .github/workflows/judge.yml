# Independent judge v1 (xauusd-quant research/system/SYSTEM_V2_PREREG.md §3.1 with Amendment B1 item 2 and Amendment
# B2 item 7; IMPLEMENTATION_REGISTER R-JC-1, R-JC-2). Runs after every completed `system` run, once a day as a
# backstop, and on manual dispatch.
# Concurrency: the workflow runs in its own group `judge`, so judge runs never overlap. Only the short `publish` job
# takes the shared group `forward-watch` (job level), for its commit and deploy, so the judge never pushes or deploys at
# the same time as the system or the forward watches and never holds that group while its checks run.
# The `judge` job reads the full history (fetch-depth 0, tags) and hands ONLY reports/judge/** and
# reports/forward_site/judge/** to `publish` as an artifact. `publish` commits only those folders (never `git add -A`;
# the step fails if its commit touches anything else), then deploys reports/forward_site/ from its own post-commit
# checkout. The Twelve Data key reaches the judge step only, as an environment variable.
name: judge

on:
  workflow_run:
    workflows: [system]
    types: [completed]
  schedule:
    - cron: "10 13 * * 2-6"   # 15:10 Tripoli, Tue-Sat: backstop after the system's 03:20 and 09:20 runs
  workflow_dispatch:

concurrency:
  group: judge
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      finished: ${{ steps.judge.outputs.finished }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      # J1-J9, the verdict and its outputs. `finished` is set only when the judge returned normally.
      - name: Judge run
        id: judge
        continue-on-error: true
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          JUDGE_SITE_URL: https://gold-watch-mq1dqc.xauusd-quant.workers.dev
        run: |
          uv run --frozen python -I judge/run.py
          echo "finished=1" >> "$GITHUB_OUTPUT"

      - name: Check that the judge wrote only its folders
        if: ${{ steps.judge.outputs.finished == '1' }}
        run: |
          if ! git diff --quiet HEAD -- . ':(exclude)reports/judge' ':(exclude)reports/forward_site/judge'; then
            echo "the judge changed tracked files outside its folders; nothing is published"; git diff --stat HEAD; exit 1
          fi

      - name: Upload the judge records
        if: ${{ steps.judge.outputs.finished == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: judge-records
          path: |
            reports/judge
            reports/forward_site/judge
          if-no-files-found: error
          retention-days: 7

      - name: Fail the job if the judge did not finish
        if: ${{ steps.judge.outcome == 'failure' }}
        run: exit 1

  publish:
    needs: judge
    if: ${{ needs.judge.result == 'success' && needs.judge.outputs.finished == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: forward-watch
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: 940e834eb44c1584e99e270ab7a8df00
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # The judge's folders as the judge job left them (only the judge writes them; judge runs never overlap).
      - name: Restore the judge records
        uses: actions/download-artifact@v4
        with:
          name: judge-records
          path: reports

      - name: Commit the judge records
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          allowed='^(reports/judge|reports/forward_site/judge)/'
          if ! git diff --quiet HEAD -- . ':(exclude)reports/judge' ':(exclude)reports/forward_site/judge'; then
            echo "the judge changed tracked files outside its folders; nothing is committed"; git diff --stat HEAD; exit 1
          fi
          for p in reports/judge reports/forward_site/judge; do
            if [ -e "$p" ]; then git add -- "$p"; fi
          done
          outside=$(git diff --cached --name-only | grep -v -E "$allowed" || true)
          if [ -n "$outside" ]; then echo "staged outside the judge folders: $outside"; git reset -q; exit 1; fi
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "judge run $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase; then
              touched=$(git diff-tree --no-commit-id --name-only -r HEAD | grep -v -E "$allowed" || true)
              if [ -n "$touched" ]; then echo "the judge commit touches other paths: $touched"; exit 1; fi
              git push -q && exit 0
            else
              git rebase --abort 2>/dev/null || true
            fi
            echo "push attempt $i failed"; sleep 20
          done
          exit 1

      - name: Deploy the site from the post-commit checkout
        if: ${{ !cancelled() && steps.commit.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain -- reports/forward_site)" ]; then
            echo "reports/forward_site differs from the checked-out commit; not deployed"; git status --short; exit 1
          fi
          npx --yes wrangler@4.151.1 deploy --config reports/forward_deploy/wrangler.jsonc
