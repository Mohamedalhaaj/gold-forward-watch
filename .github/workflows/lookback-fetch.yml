# One-off: download the lab v2 input-only lookback (Dukascopy XAUUSD M1, 2026-01-01..2026-08-31) on GitHub, because
# the feed throttles the client's Mac. Runs only on pushes to this branch; never touches main or the live jobs.
name: lookback-fetch

on:
  push:
    branches: [lookback-fetch]
    paths: [".github/workflows/lookback-fetch.yml", "tools/lookback_fetch.py"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: python3 -I tools/lookback_fetch.py
      - name: Commit the raw files and the manifest to this branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/system/lab_v2/lookback
          git commit -q -m "lookback raw files fetched on GitHub $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin HEAD:lookback-fetch
