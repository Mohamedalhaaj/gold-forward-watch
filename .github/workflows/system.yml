# Gold support system v1 (xauusd-quant research/system/SYSTEM_V1_PREREG.md §7): fetch Dukascopy M1 bid/ask, the
# write-once forecast store, L3 calibration and the green suppression, the forward signal lab, publish, deploy.
# It shares the concurrency group of forward-watch.yml, so the two jobs never push at the same time, and it never
# writes the watch paths (checked below). No self-disable: the client stops it.
name: system

on:
  schedule:
    - cron: "20 3 * * 2-6"   # 05:20 Tripoli, Tue-Sat: settles the model day that closed overnight
    - cron: "20 9 * * 2-6"   # 11:20 Tripoli, Tue-Sat (retries a late or failed fetch; Saturday = proposer day)
  workflow_dispatch:

concurrency:
  group: forward-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  system:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_ACCOUNT_ID: 940e834eb44c1584e99e270ab7a8df00
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # fetch, store, forecasts, L3, lab, proposer (on its Saturday), publish, then wrangler deploy (same site and
      # secret as forward-watch). A FROZEN mismatch or a tripwire difference halts the lab and fails this step.
      - name: System run
        id: run
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: uv run --frozen python -I analysis/system/run.py

      - name: The watch paths are untouched
        if: ${{ !cancelled() }}
        run: |
          git diff --quiet HEAD -- analysis/forward_doubletop_tracker.py analysis/forward_wick_tracker.py \
            reports/forward_doubletop reports/forward_wick data/forward_doubletop data/forward_wick \
            .github/workflows/forward-watch.yml reports/FORWARD_DOUBLETOP_PREREG.md \
            reports/FORWARD_DOUBLETOP_CAUSAL_PREREG.md reports/FORWARD_WICK_PREREG.md

      - name: Commit the system ledgers
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/system reports/system reports/forward_site/system
          if ! git diff --cached --quiet; then
            git commit -q -m "system run $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3 4 5; do
              git pull -q --rebase && git push -q && exit 0
              echo "push attempt $i failed"; sleep 20
            done
            exit 1
          fi

      # Lab v2 (xauusd-quant research/system/SYSTEM_V2_PREREG.md §2.5; OPS edit logged in reports/system/ops_changes.csv).
      # It runs only after v1's run, deploy and commit are done (and only if v1's commit step succeeded), with
      # continue-on-error and its own timeout, and commits only its own three folders in a separate commit, so it
      # never changes v1's exit code, publish, deploy or commit. A v2 failure halts v2 only (reports/system/lab_v2/HALT.md).
      # `finished` is set only when run_v2.py reported its own end: it writes its exit code to $LAB2_EXIT_FILE last,
      # after HALT.md for a halt or a caught crash (an import error included).
      - name: Lab v2 run
        id: lab2
        continue-on-error: true
        timeout-minutes: 10
        run: |
          export LAB2_EXIT_FILE="$RUNNER_TEMP/lab2_exit"
          rm -f "$LAB2_EXIT_FILE"
          code=0
          uv run --frozen python -I analysis/system/lab_v2/run_v2.py || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ -f "$LAB2_EXIT_FILE" ] && [ "$(cat "$LAB2_EXIT_FILE")" = "$code" ]; then
            echo "finished=1" >> "$GITHUB_OUTPUT"
          fi
          exit $code

      # The lab v2 step ran but did not report its end (the timeout, a killed process such as out of memory, a crash
      # before run_v2.py could record it, a failed `uv run`): its partial writes are discarded (the three lab v2
      # folders are restored to HEAD) and the same crash record is written (analysis/system/lab_v2/v2_crash.py:
      # HALT.md, halts.csv, summary.json marked PAUSED, the client's page re-rendered). The commit step below then
      # commits it, so v1's next publish shows lab2_state PAUSED. v1's files are never touched.
      - name: Lab v2 did not finish
        id: lab2_crash
        if: ${{ !cancelled() && steps.lab2.outcome != 'skipped' && steps.lab2.outputs.finished != '1' }}
        continue-on-error: true
        run: |
          for p in data/system/lab_v2 reports/system/lab_v2 reports/forward_site/system/lab_v2; do
            if git ls-files --error-unmatch "$p" >/dev/null 2>&1; then git checkout -q HEAD -- "$p"; fi
            git clean -fdq -- "$p"
          done
          reason="lab v2 step did not finish (timeout or kill; exit code ${{ steps.lab2.outputs.code || 'none' }})"
          head=$(git rev-parse HEAD)
          uv run --frozen python -I analysis/system/lab_v2/v2_crash.py --reason "$reason" --head "$head" \
            || python3 -I analysis/system/lab_v2/v2_crash.py --reason "$reason" --head "$head"

      - name: Commit the lab v2 ledgers
        id: lab2_commit
        if: ${{ !cancelled() && steps.lab2.outcome != 'skipped' }}
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet HEAD -- . ':(exclude)data/system/lab_v2' ':(exclude)reports/system/lab_v2' \
              ':(exclude)reports/forward_site/system/lab_v2'; then
            echo "lab v2 changed tracked files outside its folders; nothing is committed"; git diff --stat HEAD; exit 1
          fi
          for p in data/system/lab_v2 reports/system/lab_v2 reports/forward_site/system/lab_v2; do
            if [ -e "$p" ] || git ls-files --error-unmatch "$p" >/dev/null 2>&1; then git add -- "$p"; fi
          done
          outside=$(git diff --cached --name-only | grep -v -E '^(data/system/lab_v2|reports/system/lab_v2|reports/forward_site/system/lab_v2)/' || true)
          if [ -n "$outside" ]; then echo "staged outside the lab v2 folders: $outside"; git reset -q; exit 1; fi
          if ! git diff --cached --quiet; then
            git commit -q -m "lab v2 run $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3 4 5; do
              git pull -q --rebase && git push -q && exit 0
              echo "push attempt $i failed"; sleep 20
            done
            exit 1
          fi

      - name: Fail the job if the run halted or failed
        if: ${{ steps.run.outcome == 'failure' }}
        run: exit 1
