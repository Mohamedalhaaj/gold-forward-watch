# The analyst judge (xauusd-quant research/analyst/ANALYST_V1_PREREG.md §8 as amended by v0.5 M7 and v0.6;
# IMPLEMENTATION_REGISTER R-AN-1, R-AN-66..R-AN-70, amendment §16.18 A6). It lives here, in gold-forward-watch (R-AN-1;
# prereg R1(a): the analyst's repository holds no judge outputs), and reads the public repositories
# Mohamedalhaaj/gold-analyst and Mohamedalhaaj/gold-analyst-inbox (the agent inbox, A6) as data only: full clones read
# through git objects; pushed agent commits are fetched by sha from the inbox clone into the gold-analyst clone and
# read with git; nothing from either repository is imported or executed. All other reads are public GETs and
# `git ls-remote`; no write permission is added for them.
# Script only: no model and no model key. The judge job holds no secret; it reads with the GITHUB_TOKEN.
# Triggers: after analyst-export (its push to gold-analyst starts analyst-settle there), a daily backstop after
# analyst-settle's 23:15 run, and manual dispatch. Never on a push or a pull request.
# Concurrency: its own group `analyst-judge`. Only the short `publish` job takes the shared group `forward-watch`
# (job level) for its commit and deploy, as the judge workflow does.
# The `judge` job hands ONLY reports/judge_analyst/** and reports/forward_site/judge_analyst/** to `publish` as an
# artifact. `publish` commits only those folders (never adds everything; the step fails if its commit touches
# anything else), then deploys reports/forward_site/ from its own post-commit checkout, so analyst-settle finds the
# verdict at <PINS.judge_site_url>/judge_analyst/analyst_verdict.json (R-AN-70). Only that deploy step gets the
# Cloudflare token.
name: analyst-judge

on:
  workflow_run:
    workflows: [analyst-export]
    types: [completed]
  schedule:
    - cron: "40 23 * * *"   # after analyst-settle's 23:15 backstop in gold-analyst
  workflow_dispatch:

concurrency:
  group: analyst-judge
  cancel-in-progress: false

permissions: {}

jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      issues: read
    outputs:
      finished: ${{ steps.judge.outputs.finished }}
    steps:
      # gold-forward-watch at HEAD with its history: the judge's code and folders, and the system store (R-AN-66).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: gfw
          fetch-depth: 0
          persist-credentials: false

      # The public gold-analyst, full clone with tags (a shallow clone is A0, never SOUND). Data only.
      - uses: actions/checkout@v4
        with:
          repository: Mohamedalhaaj/gold-analyst
          ref: main
          path: ga
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # The public agent inbox (PINS.inbox_repo), full with every branch: the source the pushed agent commits are
      # fetched from by sha (R-AN-70, A6). Data only: its files are never read as code, imported or run.
      - uses: actions/checkout@v4
        with:
          repository: Mohamedalhaaj/gold-analyst-inbox
          ref: main
          path: inbox
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      # A0-A12, the verdict and its outputs. `finished` is set only when the judge returned normally.
      - name: Judge run
        id: judge
        continue-on-error: true
        working-directory: gfw
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run --frozen --no-dev python -I judge_analyst/run_judge.py --repo ../ga --inbox ../inbox --fetch-pushes
          echo "finished=1" >> "$GITHUB_OUTPUT"

      - name: Check that the judge wrote only its folders
        if: ${{ steps.judge.outputs.finished == '1' }}
        working-directory: gfw
        run: |
          if ! git diff --quiet HEAD -- . ':(exclude)reports/judge_analyst' ':(exclude)reports/forward_site/judge_analyst'; then
            echo "the judge changed tracked files outside its folders; nothing is published"; git diff --stat HEAD; exit 1
          fi
          if [ -n "$(git ls-files --others --exclude-standard -- . ':(exclude)reports/judge_analyst' ':(exclude)reports/forward_site/judge_analyst')" ]; then
            echo "the judge created files outside its folders; nothing is published"; exit 1
          fi

      - name: Check that the judge left the gold-analyst clone untouched
        if: ${{ steps.judge.outputs.finished == '1' }}
        working-directory: ga
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "the gold-analyst clone changed; nothing is published"; exit 1
          fi

      - name: Check that the judge left the inbox clone untouched
        if: ${{ steps.judge.outputs.finished == '1' }}
        working-directory: inbox
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "the inbox clone changed; nothing is published"; exit 1
          fi

      - name: Upload the judge records
        if: ${{ steps.judge.outputs.finished == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: judge-analyst-records
          path: |
            gfw/reports/judge_analyst
            gfw/reports/forward_site/judge_analyst
          if-no-files-found: error
          retention-days: 7

      - name: Fail the job if the judge did not finish
        if: ${{ steps.judge.outcome == 'failure' }}
        run: exit 1

  publish:
    needs: judge
    if: ${{ needs.judge.result == 'success' && needs.judge.outputs.finished == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: forward-watch
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: 940e834eb44c1584e99e270ab7a8df00
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # The judge's folders as the judge job left them (only this workflow writes them; its runs never overlap).
      - name: Restore the judge records
        uses: actions/download-artifact@v4
        with:
          name: judge-analyst-records
          path: reports

      - name: Commit the judge records
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          allowed='^(reports/judge_analyst|reports/forward_site/judge_analyst)/'
          if ! git diff --quiet HEAD -- . ':(exclude)reports/judge_analyst' ':(exclude)reports/forward_site/judge_analyst'; then
            echo "the judge changed tracked files outside the judge folders; nothing is committed"; git diff --stat HEAD; exit 1
          fi
          for p in reports/judge_analyst reports/forward_site/judge_analyst; do
            if [ -e "$p" ]; then git add -- "$p"; fi
          done
          outside=$(git diff --cached --name-only | grep -v -E "$allowed" || true)
          if [ -n "$outside" ]; then echo "staged outside the judge folders: $outside"; git reset -q; exit 1; fi
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "analyst-judge run $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase; then
              touched=$(git diff-tree --no-commit-id --name-only -r HEAD | grep -v -E "$allowed" || true)
              if [ -n "$touched" ]; then echo "the judge commit touches other paths: $touched"; exit 1; fi
              git push -q && exit 0
            else
              git rebase --abort 2>/dev/null || true
            fi
            echo "push attempt $i failed"; sleep 20
          done
          exit 1

      - name: Deploy the site from the post-commit checkout
        if: ${{ !cancelled() && steps.commit.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain -- reports/forward_site)" ]; then
            echo "reports/forward_site differs from the checked-out commit; not deployed"; git status --short; exit 1
          fi
          npx --yes wrangler@4.151.1 deploy --config reports/forward_deploy/wrangler.jsonc
